<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Chumbo</title>
    <link rel="canonical" href="https://chumbo.netlify.app/" />
    <meta
      name="description"
      content="The Chumbo almanac — fifteen seasons of fantasy football, 2012 to 2026. Standings, matchups, draft boards, trades, player and manager records, and every head-to-head ever played. Settle the argument."
    />

    <!-- Open Graph -->
    <meta property="og:site_name" content="The Chumbo" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chumbo.netlify.app/" />
    <meta property="og:title" content="The Chumbo" />
    <meta
      property="og:description"
      content="The Chumbo almanac — fifteen seasons of fantasy football, 2012 to 2026. Standings, matchups, draft boards, trades, player and manager records, and every head-to-head ever played. Settle the argument."
    />
    <meta property="og:image" content="https://chumbo.netlify.app/images/logo.png" />
    <meta property="og:image:width" content="256" />
    <meta property="og:image:height" content="338" />
    <meta property="og:image:alt" content="The Chumbo league crest" />

    <!-- Twitter -->
    <!-- summary, not summary_large_image: the crest is portrait 256x338 and
         letterboxes badly.

         G6 has landed, and every manager, season and head-to-head page now
         serves its own 1200x630 card with summary_large_image — but it does
         that by rewriting this head into dist/<route>/index.html, never by
         editing this file (scripts/prerender-og.ts). This one stays on the
         crest because it is two things at once: the home page's own head, and
         the fallback Netlify serves for every path nobody prerendered. A card
         about one manager's season would be wrong on both. Giving the front
         door a card of its own needs a template for "the whole almanac",
         which G2's five do not include. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="The Chumbo" />
    <meta
      name="twitter:description"
      content="The Chumbo almanac — fifteen seasons of fantasy football, 2012 to 2026. Standings, matchups, draft boards, trades, player and manager records, and every head-to-head ever played. Settle the argument."
    />
    <meta name="twitter:image" content="https://chumbo.netlify.app/images/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
